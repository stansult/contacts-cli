[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "contacts-cli"
version = "0.1.0"
description = "Preview and append Gmail label senders to an existing Google contact"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.5,<2",
  "httplib2>=0.22,<1",
  "oauthlib>=3.2,<5",
  "requests>=2.32,<3",
]

[project.scripts]
contacts-cli = "contacts_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-socket>=0.7,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
